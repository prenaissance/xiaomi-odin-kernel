%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/hynix,hi847.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SK Hynix Hi-847 1/4" 8M Pixel MIPI CSI-2 sensor

maintainers:
  - Alexandru Andrieș <alex.andries.aa@gmail.com>

description: |-
  The Hi-847 is a raw image sensor with a MIPI CSI-2 image data
  interface and CCI (I2C compatible) control bus. The output format
  is raw Bayer.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: hynix,hi847

  reg:
    maxItems: 1

  clocks:
    items:
      - description: Reference to the mclk clock (19.2 MHz).

  reset-gpios:
    description: Reference to the GPIO connected to the RESETB pin. Active low.
    maxItems: 1

  vddio-supply:
    description: Definition of the regulator used for the VDDIO power supply.

  vdda-supply:
    description: Definition of the regulator used for the VDDA power supply.

  vddd-supply:
    description: Definition of the regulator used for the VDDD power supply.

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    unevaluatedProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            oneOf:
              - items:
                  - const: 1
                  - const: 2
              - items:
                  - const: 1
                  - const: 2
                  - const: 3
                  - const: 4

          link-frequencies: true

        required:
          - data-lanes
          - link-frequencies

required:
  - compatible
  - reg
  - clocks
  - vddio-supply
  - vdda-supply
  - vddd-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/media/video-interface-devices.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@20 {
            compatible = "hynix,hi847";
            reg = <0x20>;
            clocks = <&clk 0>;
            vddio-supply = <&reg_camera_vddio>;
            vdda-supply = <&reg_camera_vdda>;
            vddd-supply = <&reg_camera_vddd>;
            reset-gpios = <&gpio1 25 GPIO_ACTIVE_LOW>;
            orientation = <MEDIA_ORIENTATION_BACK>;
            rotation = <90>;

            port {
                camera_out: endpoint {
                    remote-endpoint = <&csi_ep>;
                    link-frequencies = /bits/ 64
                        <400000000 200000000>;
                    data-lanes = <1 2 3 4>;
                };
            };
        };
    };

...
