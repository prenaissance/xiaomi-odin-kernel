%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/samsung,s5khmx.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S5KHMX 108MP CMOS Image Sensor

maintainers:
  - Alexandru Andries <alex.andries.aa@gmail.com>

description: |
  Samsung S5KHMX is a 108-megapixel (12032x9024) 1/1.33-inch CMOS image
  sensor supporting Tetracell binning and 3-trio MIPI CSI-2 C-PHY output.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: samsung,s5khmx

  reg:
    maxItems: 1

  clocks:
    maxItems: 1
    description: Input reference clock (19.2 MHz)

  power-domains:
    maxItems: 1

  reset-gpios:
    maxItems: 1
    description: Active-low XSHUTDN reset GPIO

  vdda-supply:
    description: Analog power supply (2.8V)

  vddd-supply:
    description: Digital core power supply (1.1V)

  vddio-supply:
    description: Digital I/O power supply (1.8V)

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          bus-type:
            const: 1 # MEDIA_BUS_TYPE_CSI2_CPHY

          data-lanes:
            items:
              - const: 0
              - const: 1
              - const: 2

          link-frequencies: true

        required:
          - bus-type
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - vdda-supply
  - vddd-supply
  - vddio-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/media/video-interfaces.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@3d {
            compatible = "samsung,s5khmx";
            reg = <0x3d>;

            reset-gpios = <&tlmm 16 GPIO_ACTIVE_LOW>;
            clocks = <&camcc 0>;
            assigned-clocks = <&camcc 0>;
            assigned-clock-rates = <19200000>;

            vddio-supply = <&pm8008i_l6>;
            vdda-supply = <&vreg_cam_wide_vana>;
            vddd-supply = <&pm8008i_l2>;

            orientation = <1>;
            rotation = <90>;

            port {
                endpoint {
                    bus-type = <MEDIA_BUS_TYPE_CSI2_CPHY>;
                    data-lanes = <0 1 2>;
                    link-frequencies = /bits/ 64 <601600000 1798400000>;
                    remote-endpoint = <&csiphy1_ep>;
                };
            };
        };
    };
...
