%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/st,fts-spi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: STMicroelectronics FingerTip S (FTS5) SPI Touchscreen Controller

maintainers:
  - Andi Shyti <andi.shyti@kernel.org>

allOf:
  - $ref: touchscreen.yaml#
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: st,fts-spi

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  avdd-supply:
    description: Analog 3.3V power supply

  vdd-supply:
    description: Digital I/O 1.8V power supply

  st,super-resolution:
    type: boolean
    description:
      Controller firmware reports 16-bit super-resolution X/Y coordinates in
      events rather than packed 12-bit coordinates.

required:
  - compatible
  - reg
  - interrupts
  - avdd-supply
  - vdd-supply

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@0 {
            compatible = "st,fts-spi";
            reg = <0>;
            spi-max-frequency = <7000000>;
            interrupt-parent = <&tlmm>;
            interrupts = <23 IRQ_TYPE_LEVEL_LOW>;
            reset-gpios = <&tlmm 22 GPIO_ACTIVE_LOW>;
            avdd-supply = <&touch_avdd_vreg>;
            vdd-supply = <&pm8350c_l2>;
            touchscreen-size-x = <10800>;
            touchscreen-size-y = <24000>;
            st,super-resolution;
        };
    };
