%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/xiaomi,odin-csot-nt37701.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Xiaomi MIX 4 CSOT K8 42-02-0a (Novatek NT37701) AMOLED DSI Panel

maintainers:
  - Neil Armstrong <neil.armstrong@linaro.org>

description:
  1080x2400 120Hz under-display-camera (CUP) AMOLED command-mode DSC 1.1 panel
  manufactured by CSOT with a Novatek NT37701-family DDIC, used in the Xiaomi
  MIX 4 (odin) smartphone.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: xiaomi,odin-csot-nt37701

  reg:
    maxItems: 1
    description: DSI virtual channel

  avdd-supply:
    description: Analog 3.0V power supply

  vddd-supply:
    description: Digital core power supply

  vddio-supply:
    description: Digital I/O 1.8V power supply

  reset-gpios: true
  port: true

required:
  - compatible
  - reg
  - avdd-supply
  - vddd-supply
  - vddio-supply
  - reset-gpios
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "xiaomi,odin-csot-nt37701";
            reg = <0>;
            avdd-supply = <&pm8350c_l13>;
            vddd-supply = <&disp_vddd_vreg>;
            vddio-supply = <&disp_vddi_vreg>;
            reset-gpios = <&tlmm 24 GPIO_ACTIVE_LOW>;

            port {
                endpoint {
                    remote-endpoint = <&mdss_dsi0_out>;
                };
            };
        };
    };
...
